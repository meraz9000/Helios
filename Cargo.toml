[workspace]
resolver = "2"
members = [
    "crates/helios-proto",
    "crates/helios-relay",
    "crates/helios-transport",
    "crates/helios-host-win",
    "crates/helios-client-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Serialization & framing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytes = "1.10"
toml = "0.8"

# Async runtime & networking (QUIC + WebSocket signaling)
tokio = { version = "1.44", features = ["full"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }

# Cryptography & identity
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"

# Compression (Survival/Text Mode dirty tiles)
zstd = "0.13"

# CLI, logging & errors
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
helios-proto = { path = "crates/helios-proto" }
helios-transport = { path = "crates/helios-transport" }
