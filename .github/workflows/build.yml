name: Build Helios (Windows Host & macOS Viewer)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    name: Linux Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build-windows:
    name: Build Windows Host (helios-host.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build helios-host.exe (Release)
        run: cargo build --release -p helios-host-win
      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item target/release/helios-host.exe dist-win/helios-host.exe
          Compress-Archive -Path dist-win/helios-host.exe -DestinationPath dist-win/helios-host-windows-x64.zip -Force
      - name: Upload Windows Host artifact
        uses: actions/upload-artifact@v4
        with:
          name: helios-host-windows-x64
          path: dist-win/

  build-macos:
    name: Build macOS Viewer (HeliosViewer)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Rust client staticlib (libhelios_client_core.a)
        run: cargo build --release -p helios-client-core
      - name: Build SwiftUI + Metal + VideoToolbox viewer
        working-directory: apps/helios-macos
        run: swift build -c release
      - name: Package macOS .app bundle
        run: |
          mkdir -p dist-mac/HeliosViewer.app/Contents/MacOS
          cp apps/helios-macos/.build/release/HeliosViewer dist-mac/HeliosViewer.app/Contents/MacOS/HeliosViewer
          cat > dist-mac/HeliosViewer.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>HeliosViewer</string>
            <key>CFBundleIdentifier</key><string>com.helios.viewer</string>
            <key>CFBundleName</key><string>HeliosViewer</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          (cd dist-mac && zip -rq HeliosViewer-macOS.zip HeliosViewer.app)
          rm -rf dist-mac/HeliosViewer.app
          cp apps/helios-macos/.build/release/HeliosViewer dist-mac/HeliosViewer
          cp target/release/helios-cli dist-mac/helios-cli
      - name: Upload macOS Viewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: helios-viewer-macos
          path: dist-mac/

  publish-release:
    name: Publish Latest Pre-Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: helios-host-windows-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: helios-viewer-macos
          path: release-assets
      - name: Publish / update latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release-assets
          gh release delete latest --yes 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest
          gh release create latest \
            release-assets/helios-host.exe \
            release-assets/helios-host-windows-x64.zip \
            release-assets/HeliosViewer-macOS.zip \
            release-assets/HeliosViewer \
            release-assets/helios-cli \
            --title "Helios Latest Build (Double-Click Windows Host & macOS App)" \
            --notes "Double-click helios-host.exe on Windows to auto-install in the background and display your unique Access Passcode. Unzip HeliosViewer-macOS.zip on Mac and double-click HeliosViewer.app to connect." \
            --prerelease
